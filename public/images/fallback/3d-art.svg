<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 442">
  <!-- 宣纸底 -->
  <rect width="320" height="442" fill="#faf6ee"/>
  <!-- 细边框 -->
  <rect x="10" y="10" width="300" height="422" fill="none" stroke="#e6dccb" stroke-width="1"/>
  <!-- 瓦当主体圆形 -->
  <circle cx="160" cy="220" r="108" fill="none" stroke="#8a6b20" stroke-width="2" opacity="0.8"/>
  <circle cx="160" cy="220" r="90" fill="none" stroke="#b8892a" stroke-width="1.2" opacity="0.6"/>
  <circle cx="160" cy="220" r="72" fill="none" stroke="#a8261f" stroke-width="0.8" opacity="0.4"/>
  <!-- 中心乳钉 -->
  <circle cx="160" cy="220" r="18" fill="#8a6b20" opacity="0.8"/>
  <circle cx="160" cy="220" r="10" fill="#b8892a" opacity="0.9"/>
  <!-- 瓦当云纹十字四向 -->
  <g stroke="#2d4a6b" stroke-width="1.5" fill="none" opacity="0.55" stroke-linecap="round">
    <!-- 上 -->
    <path d="M160 112 Q150 140 160 168 Q170 196 160 210"/>
    <!-- 下 -->
    <path d="M160 328 Q150 300 160 272 Q170 244 160 230"/>
    <!-- 左 -->
    <path d="M52 220 Q80 210 108 220 Q136 230 150 220"/>
    <!-- 右 -->
    <path d="M268 220 Q240 210 212 220 Q184 230 170 220"/>
  </g>
  <!-- 瓦当边缘瓦筒 -->
  <rect x="140" y="328" width="40" height="40" fill="#8a6b20" opacity="0.55"/>
  <rect x="155" y="368" width="10" height="20" fill="#6b5318" opacity="0.7"/>
  <!-- 铭文 -->
  <text x="160" y="400" text-anchor="middle" font-family="SimSun,serif" font-size="12" fill="#8a6b20" opacity="0.7">千 · 秋 · 永 · 固</text>
  <!-- 朱砂方印 -->
  <rect x="248" y="385" width="44" height="44" fill="#a8261f" opacity="0.82"/>
  <text x="270" y="415" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#faf6ee" font-weight="700">当</text>
  <!-- 编号 -->
  <text x="22" y="432" font-family="SimSun,serif" font-size="11" fill="#7a6650" opacity="0.6">伍 · 瓦当</text>
</svg>