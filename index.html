<meta name="theme-color" content="#f5f3fa" media="(prefers-color-scheme: light)" />
<!-- 防止主题闪烁(FOUC)：在CSS加载前根据localStorage设置data-theme -->
<script>
  (function() {
    var saved = localStorage.getItem('dreamcore-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else if (saved === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    // 无saved时跟随系统偏好（CSS @media自动处理）
  })();
</script>

  </div>

    <span class="tag-filter-current" id="current-tag-name"></span>
    <button class="tag-filter-clear" id="clear-tag-btn" aria-label="清除标签筛选"><i class="fa-solid fa-xmark" aria-hidden="true"></i> 清除</button>

  <div class="gallery-grid" id="gallery-grid" role="feed" aria-label="艺术作品列表"></div>
