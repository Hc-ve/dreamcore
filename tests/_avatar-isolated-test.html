<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>头像 CSS 隔离测试</title>
<style>
  /* 从 style.css 复制的基础 .avatar-circle */
  .avatar-circle {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-weight: 600; flex-shrink: 0; box-shadow: 0 2px 10px rgba(201,182,255,0.3);
    width: 30px; height: 30px; font-size: 13px;
    background: #ccc; /* 让圆形背景可见 */
  }
  .avatar-circle.lg { width: 44px; height: 44px; font-size: 18px; }

  /* 我的修复规则 */
  .avatar-circle.avatar-img {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    flex: 0 0 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  .avatar-circle.lg.avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

  /* 容器 */
  body { font-family: sans-serif; padding: 40px; background: #1a1a2e; color: #eee; }
  .test-row { display: flex; align-items: center; gap: 20px; margin: 20px 0; padding: 16px; background: rgba(255,255,255,0.05); border-radius: 8px; }
  .test-label { min-width: 280px; font-size: 14px; opacity: .8; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .ok { background: #22c55e33; color: #4ade80; }
  .bad { background: #ef444433; color: #f87171; }
  .rect { border: 2px dashed #fbbf24; display: inline-block; }
</style>
</head>
<body>
<h2>头像 CSS 隔离测试 —— 纯静态，排除 Vite/HMR/缓存干扰</h2>
<p>如果 1000x1000 的图片能被约束到 30x30 和 44x44，则 CSS 写法正确。</p>

<!-- 用 base64 嵌入一张 1000x1000 的红色方块图，代表未裁剪的上传图 -->
<!-- 用 canvas 动态生成避免 base64 太长 -->

<div class="test-row">
  <div class="test-label">测试 1: .avatar-circle (30px) + img.avatar-circle.avatar-img</div>
  <span class="rect" style="width:30px;height:30px;"></span> <!-- 参考框 -->
  <span class="avatar-circle" id="t1-circle">
    <img id="t1-img" class="avatar-circle avatar-img" alt="">
  </span>
  <code id="t1-info">...</code>
</div>

<div class="test-row">
  <div class="test-label">测试 2: .avatar-circle.lg (44px) + img.avatar-circle.lg.avatar-img</div>
  <span class="rect" style="width:44px;height:44px;"></span>
  <span class="avatar-circle lg" id="t2-circle">
    <img id="t2-img" class="avatar-circle lg avatar-img" alt="">
  </span>
  <code id="t2-info">...</code>
</div>

<script>
// 生成 1000x1000 红色方块 + "BIG" 文字的 dataURL
const canvas = document.createElement('canvas');
canvas.width = 1000; canvas.height = 1000;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#ff4444'; ctx.fillRect(0, 0, 1000, 1000);
ctx.fillStyle = '#ffffff'; ctx.font = 'bold 120px sans-serif';
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.fillText('1000×1000', 500, 500);
const bigDataURL = canvas.toDataURL('image/png');

document.getElementById('t1-img').src = bigDataURL;
document.getElementById('t2-img').src = bigDataURL;

setTimeout(() => {
  function measure(imgId, circleId, expectedW, label) {
    const img = document.getElementById(imgId);
    const circle = document.getElementById(circleId);
    const r = img.getBoundingClientRect();
    const cr = circle.getBoundingClientRect();
    const cs = getComputedStyle(img);
    const ok = Math.round(r.width) === expectedW && Math.round(r.height) === expectedW;
    const badge = ok ? '<span class="badge ok">OK</span>' : '<span class="badge bad">FAIL</span>';
    const info = document.getElementById(label);
    info.innerHTML = `${badge} img=${Math.round(r.width)}×${Math.round(r.height)}  circle=${Math.round(cr.width)}×${Math.round(cr.height)}  computedW=${cs.width} flexBasis=${cs.flexBasis} minW=${cs.minWidth} objectFit=${cs.objectFit}`;
  }
  measure('t1-img', 't1-circle', 30, 't1-info');
  measure('t2-img', 't2-circle', 44, 't2-info');
}, 500);
</script>
</body>
</html>
